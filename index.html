<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>保护我们美丽的地球</title>
    <style>
        /* 全局样式和字体 */
        body {
            font-family: 'Comic Sans MS', '幼圆', cursive, sans-serif; /* 使用儿童化的字体 */
            background-color: #f0f8ff; /* 淡蓝色背景，像天空一样 */
            color: #333;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        /* 顶部标题栏 */
        header {
            background-color: #87CEEB; /* 天蓝色 */
            color: white;
            padding: 20px 10px;
            font-size: 1.8em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        /* 主场景区域 */
        .scene {
            background: linear-gradient(to bottom, #87CEEB 60%, #90EE90 40%); /* 天空到草地的渐变 */
            height: 350px;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        /* 太阳的SVG样式和动画 */
        .sun {
            position: absolute;
            top: 20px;
            left: 20px;
width: 100px;
            height: 100px;
            animation: spin20s linear infinite; /* 太阳旋转动画 */
        }

        /* 微笑的地球样式和动画 */
        .earth {
            width: 200px;
            height: 200px;
            animation: bounce 4s ease-in-out infinite; /* 地球上下浮动动画 */
        }
        
        /* 树的样式 */
        .tree {
            position: absolute;
            bottom: 10px;
            width: 100px;
            height: 150px;
        }
        .tree.left {
            left: 15%;
        }
        .tree.right {
            right: 15%;
        }

        /* 环保小贴士区域 */
        .tips-section {
            padding: 40px 20px;
        }

        .tips-section h2 {
            font-size: 1.8em;
            color: #2E8B57; /* 海绿色 */
        }

        .tips-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap; /* 在小屏幕上换行 */
            gap: 20px; /* 卡片之间的间距 */
            margin-top: 20px;
        }

        /* 每个小贴士卡片的样式 */
        .tip-card {
            background-color: #fff;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            padding: 20px;
            width: 200px;
            transition: transform 0.3s ease; /* 添加悬停效果 */
        }
        
        .tip-card:hover {
            transform: translateY(-10px) scale(1.05); /* 鼠标悬停时向上浮动并放大 */
        }

        .tip-card svg {
            width: 80px;
            height: 80px;
        }

        .tip-card p {
            font-size: 1.2em;
            color: #555;
            margin-top: 10px;
        }

        /* 底部页脚 */
        footer {
            margin-top: 30px;
            padding: 20px;
            background-color: #a0d6a0; /* 柔和的绿色 */
            color: white;
            font-size: 1.3em;
            font-weight: bold;
        }

        /* 定义动画 */
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

    </style>
</head>
<body>

    <header>
        <h1>保护我们美丽的地球 🌍</h1>
    </header>

    <main>
        <div class="scene">
            <!-- 太阳 SVG -->
            <svg class="sun" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="3" fill="#FFD700"/>
                <line x1="50" y1="1x2="50" y2="0" stroke="#FFD700" stroke-width="4"/>
                <line x1="50" y1="90" x2="50" y2="100" stroke="#FFD700" stroke-width="4"/>
                <line x1="10" y1="50" x2="0" y2="50" stroke="#FFD700" stroke-width="4"/>
                <line x1="90" y1="50" x2="100" y2="50" stroke="#FFD700" stroke-width="4"/>
                <line x1="21" y1="21" x2="14" y2="14" stroke="#FFD700" stroke-width="4"/>
                <line x1="79" y1="79" x2="86" y2="86" stroke="#FFD700" stroke-width="4"/>
                <line x1="21y1="79" x2="14" y2="86" stroke="#FFD700" stroke-width="4"/>
                <line x1="79" y1="21" x2="86" y2="14" stroke="#FFD700" stroke-width="4"/>
            </svg>
            
            <!-- 微笑的地球 SVG -->
            <svg classearth" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="48" fill="#4682B4" stroke="#333" stroke-width="2"/>
                <path d="M 20,50 A 30,30 0 0,1 80,50 A 40,40 0 0,020,50 Z" fill="#2E8B57"/>
                <path d="M 30,25 A 20,20 0 0,1 50,35" fill="#2E8B57"/>
                <path d="M 60,70 A 15,15 0 0,0 75,80" fill="#2E8B57"/>
                <!-- 眼睛 -->
                <circle cx="35" cy="45" r="5" fill="white"/>
                <circle cx="35" cy="45" r="2" fill="black"/>
                <circle cx="65" cy="45" r="5" fill="white"/>
                <circle cx="65" cy="45" r="2" fill="black"/>
                <!-- 微笑 -->
                <path d="M 35 65 Q 50 80 65 65" stroke="white" stroke-width="3" fill="none" />
            </svg>

            <!-- 树 SVG -->
            <svg class="tree left" viewBox="0 0 100 150">
                <rect x="40" y="70" width="20" height="80" fill="#8B4513"/>
                <circle cx="50" cy="50" r="40" fill="#228B22"/>
                <circle cx="30" cy="60" r="25" fill="#2E8B57"/>
                <circle cx="70" cy="60" r="25" fill="#2E8B57"/>
            </svg>
            <svg class="tree right" viewBox="0 0 100 150">
                <rect x="40" y="70" width="20" height="80" fill="#8B4513"/>
                <circle cx="50" cy="50" r="40" fill="#228B22"/>
                <circle cx="30" cy="60" r="25" fill="#2E8B57"/>
                <circle cx="70" cy="60" r="25" fill="#2E8B57"/>
            </svg>
        </div>

        <section class="tips-section">
            <h2>我们可以做什么？</h2>
            <div class="tips-container">
                <div class="tip-card">
                    <!-- 垃圾分类SVG -->
                    <svg viewBox="0 0 100 100">
                        <rect x="20" y="25" width="60" height="70" rx="5" fill="#A9A9A9" stroke="#333" stroke-width="2"/>
                        <rect x="10" y="15" width="80" height="10" rx="3" fill="#696969" stroke="#333" stroke-width="2"/>
                        <line x1="35" y1="35" x2="35" y2="85" stroke="white" stroke-width="2"/>
                        <line x1="50" y1="35" x2="50" y2="85" stroke="white" stroke-width="2"/>
                        <line x1="65" y1="35" x2="65" y2="85" stroke="white" stroke-width="2"/>
                    </svg>
                    <p>垃圾分类</p>
                </div>
                <div class="tip-card">
                    <!-- 节约用水SVG -->
                    <svg viewBox="0 0 100 100">
                        <path d="M 50 10 C 20 50, 50 90, 50 90 C 50 90, 80 50, 50 10 Z" fill="#1E90FF" stroke="#333" stroke-width="2"/>
                    </svg>
                    <p>节约用水</p>
                </div>
                <div class="tip-card">
                    <!-- 随手关灯SVG -->
                    <svg viewBox="0 0 100 100">
                        <path d="M 50 10 A 25 25 0 1 1 50 60 A 25 25 0 1 1 50 10" fill="#FFD700"/>
                        <rect x="40" y="60" width="20" height="20" fill="#C0C0C0"/>
                        <rect x="35" y="80" width="30" height="5" rx="2" fill="#A9A9A9"/>
                        <rect x="35" y88" width="30" height="5" rx="2" fill="#A9A9A9"/>
                    </svg>
                    <p>随手关灯</p>
                </div>
                <div class="tip-card">
                    <!-- 植树SVG -->
                    <svg viewBox="0 0 100 100">
                        <line x1="50" y1="40" x2="50" y2="90" stroke="#8B4513" stroke-width="8"/>
                        <path d="M 50 50 C 20 40, 20 10, 50 10 C 80 10, 80 40, 50 50 Z" fill="#228B22"/>
                        <line x1="20" y1="90" x2="80" y2="90" stroke="#90EE90" stroke-width="5"/>
                    </svg>
                    <p>多种树木</p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>我们都是地球小卫士！</p>
    </footer>

</body>
</html>
